org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0's new DSL / built-in Kotlin support (both default to true since 9.0)
# do not support the kotlin("multiplatform") plugin sharing a subproject with
# com.android.library, which :shared relies on. Opt out of both to keep the
# classic org.jetbrains.kotlin.* plugin setup. Supported until AGP 10.0 (mid-2026).
# https://developer.android.com/build/releases/agp-9-0-0-release-notes#android-gradle-plugin-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
